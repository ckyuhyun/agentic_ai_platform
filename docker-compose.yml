x-vllm-basic-service: &vllm-basic-service
    image: vllm/vllm-openai:latest # Or vllm/vllm-openvino if utilizing CPU/Intel optimizations
    container_name: vllm-server
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - OMP_NUM_THREADS=14 # Match your CPU physical cores
      # vLLM disables pinned memory on WSL2 by default (even on kernels that
      # support it), which breaks the V1 GPU worker's UVA-backed buffers with
      # "RuntimeError: UVA is not available". Opt back in -- requires WSL2
      # kernel >= 4.19.121 (run `wsl --update` on the host if unsure).
      - VLLM_WSL2_ENABLE_PIN_MEMORY=1
    ports:
        - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 600s

    ipc: host
    restart: unless-stopped
services:
  vllm-engine-finetunedmodel:
    <<: *vllm-basic-service
    volumes:
      - vllm_data:/root/.cache/huggingface      
      # Uncomment to serve a fine-tuned candidate from
      # track_issue_system/finetune/merge_and_quantize.py instead of the HF
      # hub baseline (see track_issue_system/finetune/README.md stage 3):
      - ../track_issue_system/data_pipeline/output/qwen2.5-1.5b-issue-filter:/models/candidate:ro

    # NOTE: this directory currently holds the *merged bf16* model, not a real
    # AWQ-quantized one (merge_and_quantize.py's quantize_awq() step is
    # commented out -- autoawq/triton has no Windows wheel). No --quantization
    # flag here on purpose: passing --quantization awq against a model with no
    # quantization_config in config.json fails with "Cannot find the config
    # file for awq". bf16 weights are ~4x the size of the 4-bit AWQ baseline,
    # so gpu-memory-utilization is bumped up accordingly -- lower it (or drop
    # max-model-len) if it doesn't fit your GPU's VRAM.
    command: >
      /models/candidate
      --served-model-name Qwen/Qwen2.5-1.5B-Instruct
      --dtype bfloat16
      --max-model-len 2048
      --gpu-memory-utilization 0.8
      --enforce-eager
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --enable-prefix-caching
      --host 0.0.0.0
      --port 8000


  vllm-engine-basemodel:
    <<: *vllm-basic-service    
    volumes:
      - vllm_data:/root/.cache/huggingface      

    command: >
      Qwen/Qwen2.5-1.5B-Instruct-AWQ
      --served-model-name Qwen/Qwen2.5-1.5B-Instruct
      --quantization awq
      --max-model-len 2048
      --gpu-memory-utilization 0.8
      --enforce-eager
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --enable-prefix-caching
      --host 0.0.0.0
      --port 8000
    
