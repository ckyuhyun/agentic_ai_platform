events {
    worker_connections 1024;
}

http {
    # vLLM inference and cold-start (start_period 600s in docker-compose)
    # can both run long; keep the proxy from timing out before they answer.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    client_max_body_size 20m;

    server {
        listen 80;

        # meta-llama/Llama-3.2-3B-Instruct, HF baseline
        location /base/ {
            proxy_pass http://vllm-engine-basemodel:8000/;
            proxy_set_header Host $host;
        }

        # meta-llama/Llama-3.2-3B-Instruct, fine-tuned candidate
        location /finetuned/ {
            proxy_pass http://vllm-engine-finetunedmodel:8000/;
            proxy_set_header Host $host;
        }

        # mixedbread-ai/mxbai-embed-large-v1
        location /embed/ {
            proxy_pass http://tei-embedding-engine:80/;
            proxy_set_header Host $host;
        }

        # mixedbread-ai/mxbai-rerank-base-v1
        location /rerank/ {
            proxy_pass http://tei-reranker-engine:80/;
            proxy_set_header Host $host;
        }
    }
}
